services:
  ifile-manager:
    build:
      context: .
    image: ifile-manager/web:${IMAGE_TAG:-latest}
    container_name: ifile-manager
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATA_ROOT: /data
      MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI in the deployment env file}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?Set DATA_ENCRYPTION_KEY in the deployment env file}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the deployment env file}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-500}
    ports:
      # Bind only to the Tailscale interface when PUBLIC_BIND_IP is set.
      - "${PUBLIC_BIND_IP:-127.0.0.1}:${APP_PORT:-4300}:3000"
    volumes:
      - "${REMOVABLE_DISK_PATH:?Set REMOVABLE_DISK_PATH in .env}/ifile-manager:/data"
      # macOS host agent writes real volume capacity here; Docker's statfs is virtualized.
      - "/tmp/ifile-manager:/run/ifile-manager:ro"
    # Allows host.docker.internal to work on Linux too. On Docker Desktop it is built in.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
